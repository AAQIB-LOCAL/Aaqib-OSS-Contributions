name: Go CI

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/audit-contributions.yml"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/audit-contributions.yml"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true

      - name: Run regression tests
        run: go test -race -cover ./...

      - name: Run static analysis
        run: go vet ./...

      - name: Build standalone Linux executable
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o /tmp/contribution-audit ./cmd/audit
