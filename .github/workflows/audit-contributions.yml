name: Contribution Audit

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: contribution-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true

      - name: Generate contribution audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXCLUDED_GITHUB_OWNERS: "Aaqibhafeezkhan,AAQIB-LOCAL,AIOps-Capabilities-Hub,buildtheportfolio,stillbrainstorming,hafeez-dev-labs"
        run: go run ./cmd/audit

      - name: Commit directly when generated content changes
        run: |
          if [ -z "$(git status --porcelain -- README.md data/contributions.json)" ]; then
            echo "Contribution audit is already current."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md data/contributions.json
          git commit -m "docs: refresh OSS contribution audit"
          git push origin HEAD:main
