name: Contribution Audit

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/audit-contributions.yml"
      - "data/contributions.json"
      - "scripts/audit-contributions.ts"
      - "scripts/contribution-ledger.ts"
      - "tests/**"
      - "package.json"
      - "tsconfig.json"
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: contribution-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install pinned TypeScript toolchain
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Run contribution ledger regression tests
        run: npm test

      - name: Type-check TypeScript source
        run: npm run typecheck

      - name: Generate contribution audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXCLUDED_GITHUB_OWNERS: "Aaqibhafeezkhan,AAQIB-LOCAL,AIOps-Capabilities-Hub,buildtheportfolio,stillbrainstorming,hafeez-dev-labs"
        run: npm run audit

      - name: Commit directly when content changes
        run: |
          if git diff --quiet -- README.md data/contributions.json; then
            echo "Contribution audit is already current."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- README.md data/contributions.json scripts tests package.json tsconfig.json
          git commit -m "docs: refresh OSS contribution audit"
          git push origin HEAD:main
