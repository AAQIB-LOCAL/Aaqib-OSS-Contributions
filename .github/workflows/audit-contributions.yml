name: Contribution Audit

on:
  pull_request:
    paths:
      - ".github/workflows/audit-contributions.yml"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/audit-contributions.yml"
      - "cmd/**"
      - "internal/**"
      - "data/contributions.json"
      - "go.mod"
      - "go.sum"
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: contribution-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: false

      - name: Run regression tests
        run: go test -race -cover ./...

      - name: Run static analysis
        run: go vet ./...

      - name: Build standalone Linux executable
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/contribution-audit ./cmd/audit

      - name: Generate contribution audit
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXCLUDED_GITHUB_OWNERS: "Aaqibhafeezkhan,AAQIB-LOCAL,AIOps-Capabilities-Hub,buildtheportfolio,stillbrainstorming,hafeez-dev-labs"
        run: ./dist/contribution-audit

      - name: Commit directly when generated content changes
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$(git status --porcelain -- README.md data/contributions.json)" ]; then
            echo "Contribution audit is already current."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md data/contributions.json
          git commit -m "docs: refresh OSS contribution audit"
          git push origin HEAD:main
