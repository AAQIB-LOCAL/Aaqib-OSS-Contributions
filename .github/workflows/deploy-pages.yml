name: Deploy GitHub Pages dashboard

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "data/contributions.json"
      - ".github/workflows/deploy-pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "data/contributions.json"
      - "README.md"
      - "internal/audit/**"
      - ".github/workflows/audit-contributions.yml"
      - ".github/workflows/deploy-pages.yml"
  workflow_run:
    workflows:
      - Contribution Audit
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}

      - name: Validate dashboard JavaScript
        run: node --check docs/app.js

      - name: Validate contribution dataset
        run: python -m json.tool data/contributions.json > /dev/null

      - name: Assemble static site
        run: |
          mkdir -p _site/data
          cp -R docs/. _site/
          cp data/contributions.json _site/data/contributions.json
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
